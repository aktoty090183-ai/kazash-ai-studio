<!DOCTYPE html><html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qazaq AI Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111f;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;text-align:center;background:#19172d;border-bottom:1px solid #393454}
h1{margin:0;color:#b8a2ff;font-size:27px}
header p{color:#bbb6d4;font-size:14px}
main{max-width:650px;margin:auto;padding:20px 15px}
.card{background:#1c1b30;border:1px solid #393454;border-radius:18px;padding:20px;margin-bottom:18px}
h2{font-size:19px;margin-top:0}
label{display:block;margin:15px 0 8px;color:#ddd5ff}
textarea,select,input{width:100%;padding:13px;border-radius:10px;border:1px solid #494363;background:#111222;color:white;font-size:16px}
textarea{height:130px;resize:vertical}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#8664ef;color:white;font-size:16px;font-weight:bold;margin-top:15px}
button:active{opacity:.8}
.note{font-size:13px;color:#bbb6d4;line-height:1.6}
footer{text-align:center;color:#9b96b8;padding:20px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🎬 Qazaq AI Studio</h1>
<p>Идеяңызды видеоға айналдырыңыз</p>
</header>
<main>
<div class="card">
<h2>✨ Видео жасау жобасы</h2>
<label for="prompt">Видео туралы мәтін жазыңыз</label>
<textarea id="prompt" placeholder="Мысалы: Қазақ ауылындағы әже киіз үйде жүн иіріп, балаларға қазақ дәстүрін түсіндіреді..."></textarea>
<label for="style">Видео стилі</label>
<select id="style">
<option>3D мультфильм</option>
<option>2D мультфильм</option>
<option>Шынайы көрініс</option>
<option>Ұлттық қазақы стиль</option>
<option>Балаларға арналған анимация</option>
</select>
<label for="duration">Видео ұзақтығы</label>
<select id="duration">
<option>15 секунд</option>
<option>30 секунд</option>
<option>1 минут</option>
<option>2 минут</option>
</select>
<label for="voice">Дауыс</label>
<select id="voice">
<option>Қазақша әйел дауысы</option>
<option>Қазақша ер адам дауысы</option>
<option>Дауыссыз</option>
</select>
<button onclick="makeOrder()">📩 Видеоға тапсырыс беру</button>
<p class="note">Бұл бастапқы нұсқа. Нақты AI видео генерациясын кейін қосамыз.</p>
</div>
<div class="card">
<h2>📋 Тапсырыс ақпараты</h2>
<p id="result" class="note">Мәтінді толтырып, тапсырыс батырмасын басыңыз.</p>
<button onclick="copyOrder()">📋 Тапсырысты көшіру</button>
</div>
</main>
<footer>Qazaq AI Studio © 2026</footer>
<script>
function makeOrder(){
const p=document.getElementById('prompt').value.trim();
if(!p){alert('Алдымен видео туралы мәтін жазыңыз!');return;}
const s=document.getElementById('style').value;
const d=document.getElementById('duration').value;
const v=document.getElementById('voice').value;
document.getElementById('result').innerText=
'Мәтін: '+p+'\nСтиль: '+s+'\nҰзақтығы: '+d+'\nДауыс: '+v+
'\n\nТапсырыс сипаттамасы дайын. Оны көшіріп сақтай аласыз.';
}
function copyOrder(){
const t=document.getElementById('result').innerText;
if(!t||t.startsWith('Мәтінді толтырып')){alert('Алдымен тапсырыс мәліметтерін толтырыңыз.');return;}
if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert('Тапсырыс көшірілді!')).catch(()=>alert(t));}
else{alert(t);}
}
</script>
</body>
</html>
